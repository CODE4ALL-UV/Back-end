name: Codacy Code Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar la versión de Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 3. Instalar dependencias
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            -r requirements.txt \
            -r services/neon-storage-backend-service/requirements.txt \
            -r services/course-content-backend-service/requirements.txt \
            -r services/user-management-backend-service/requirements.txt

          pip install pytest pytest-cov

      # 4. Ejecutar pruebas y generar coverage.xml
      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/services/neon-storage-backend-service:${{ github.workspace }}/services/course-content-backend-service:${{ github.workspace }}/services/user-management-backend-service
        run: |
          pytest tests --cov=. --cov-report=xml

      # 5. Enviar el reporte de coverage a Codacy
      - name: Run codacy-coverage-reporter
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml
