name: Codacy Code Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. Descargar el repositorio principal (Gateway)
      - name: Checkout gateway
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 3. Crear la estructura de microservicios
      - name: Create services directory
        run: |
          mkdir -p services

      # 4. Clonar todos los microservicios
      - name: Checkout backend services
        run: |
          git clone https://github.com/CODE4ALL-UV/neon-storage-backend-service.git \
            services/neon-storage-backend-service

          git clone https://github.com/CODE4ALL-UV/user-management-backend-service.git \
            services/user-management-backend-service

          git clone https://github.com/CODE4ALL-UV/course-content-backend-service.git \
            services/course-content-backend-service

          git clone https://github.com/CODE4ALL-UV/assessment-backend-service.git \
            services/assessment-backend-service

          git clone https://github.com/CODE4ALL-UV/progress-tracking-backend-service.git \
            services/progress-tracking-backend-service

          git clone https://github.com/CODE4ALL-UV/accessibility-backend-service.git \
            services/accessibility-backend-service

          git clone https://github.com/CODE4ALL-UV/multimodal-interaction-backend-service.git \
            services/multimodal-interaction-backend-service

          git clone https://github.com/CODE4ALL-UV/device-management-backend-service.git \
            services/device-management-backend-service

      # 5. Instalar todas las dependencias
      # requirements.txt del gateway ya incluye
      # los requirements.txt de los 8 microservicios.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 6. Ejecutar pruebas y generar coverage.xml
      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests --cov=. --cov-report=xml

      # 7. Enviar coverage.xml a Codacy
      - name: Run codacy-coverage-reporter
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml
